<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Converter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --accent:#3b82f6;--accent2:#2563eb;--green:#22c55e;
  --red:#ef4444;--border:#334155;--radius:8px
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden
}
.container{display:flex;height:100vh;flex-direction:column}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border)
}
.logo{font-size:18px;font-weight:700}
.logo span{background:linear-gradient(135deg,var(--accent),#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{
  padding:8px 16px;font-size:13px;font-weight:500;border:none;
  border-radius:6px;cursor:pointer;transition:all .15s
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-danger:hover{border-color:var(--red);color:var(--red)}
.btn-sm{padding:6px 10px;font-size:12px}
select{
  padding:8px 12px;font-size:13px;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);border-radius:6px;cursor:pointer;outline:none
}
.toolbar{
  display:flex;gap:6px;padding:10px 20px;background:var(--bg);
  border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center
}
.toolbar-btn{
  padding:5px 10px;font-size:12px;font-weight:600;background:var(--bg3);
  border:1px solid var(--border);color:var(--text2);border-radius:5px;
  cursor:pointer;transition:all .15s
}
.toolbar-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar-divider{width:1px;height:20px;background:var(--border);margin:0 4px}
.main{display:flex;flex:1;overflow:hidden}
.pane{flex:1;display:flex;flex-direction:column}
.pane:first-child{border-right:1px solid var(--border)}
.pane-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3)
}
.stats{font-size:11px;color:var(--green);text-transform:none;font-weight:400}
#inputText{
  flex:1;width:100%;padding:20px;font-size:14px;font-family:'JetBrains Mono','Fira Code',monospace;
  line-height:1.6;color:var(--text);background:var(--bg);border:none;resize:none;outline:none
}
#inputText::placeholder{color:var(--text3)}
#outputText{
  flex:1;padding:20px;font-size:14px;font-family:'JetBrains Mono','Fira Code',monospace;
  line-height:1.6;color:var(--text);overflow-y:auto;white-space:pre-wrap;word-wrap:break-word;
  background:var(--bg)
}
.placeholder{color:var(--text3)}
.sidebar{
  width:280px;background:var(--bg2);border-left:1px solid var(--border);
  display:flex;flex-direction:column;transition:transform .2s
}
.sidebar.hidden{transform:translateX(280px);position:absolute;right:0}
.sidebar-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px;border-bottom:1px solid var(--border)
}
.sidebar-header h3{font-size:14px;font-weight:600}
.history-list{flex:1;overflow-y:auto;padding:8px}
.history-item{
  padding:12px;border-radius:6px;cursor:pointer;transition:background .15s;margin-bottom:4px
}
.history-item:hover{background:var(--bg3)}
.history-title{
  font-size:13px;font-weight:500;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.history-meta{font-size:11px;color:var(--text3)}
.notification{
  position:fixed;bottom:24px;right:24px;padding:12px 24px;border-radius:6px;
  font-size:14px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.3);
  transition:all .3s;z-index:100;background:var(--green);color:#fff
}
.notification.hidden{opacity:0;transform:translateY(10px);pointer-events:none}
.notification.error{background:var(--red)}
kbd{
  padding:2px 6px;font-size:11px;background:var(--bg3);border-radius:4px;
  border:1px solid var(--border);font-family:monospace
}
.shortcuts{
  position:fixed;bottom:24px;left:24px;padding:10px 14px;
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  font-size:11px;color:var(--text2);line-height:1.8
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
@media(max-width:768px){
  .main{flex-direction:column}
  .pane:first-child{border-right:none;border-bottom:1px solid var(--border)}
  .pane{min-height:50vh}
  .sidebar{width:100%;position:fixed;right:0;top:0;height:100vh;z-index:50}
  .shortcuts{display:none}
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo">⚡ <span>Markdown Converter</span></div>
    <div class="header-actions">
      <select id="formatSelect">
        <option value="claude">Claude</option>
        <option value="github">GitHub</option>
        <option value="standard">Standard</option>
      </select>
      <button class="btn btn-primary" onclick="convertText()" title="Ctrl+Enter">✨ Convert</button>
      <button class="btn btn-secondary" onclick="copyOutput()" title="Ctrl+Shift+C">📋 Copy</button>
      <button class="btn btn-secondary" onclick="toggleHistory()">📜 History</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="toolbar-btn" onclick="insertFormat('h1')">H1</button>
    <button class="toolbar-btn" onclick="insertFormat('h2')">H2</button>
    <button class="toolbar-btn" onclick="insertFormat('h3')">H3</button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn" onclick="insertFormat('bold')"><b>B</b></button>
    <button class="toolbar-btn" onclick="insertFormat('italic')"><i>I</i></button>
    <button class="toolbar-btn" onclick="insertFormat('strike')"><s>S</s></button>
    <button class="toolbar-btn" onclick="insertFormat('code')">&lt;/&gt;</button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn" onclick="insertFormat('ul')">• List</button>
    <button class="toolbar-btn" onclick="insertFormat('ol')">1. List</button>
    <button class="toolbar-btn" onclick="insertFormat('task')">☑ Task</button>
    <button class="toolbar-btn" onclick="insertFormat('quote')">" Quote</button>
    <button class="toolbar-btn" onclick="insertFormat('link')">🔗 Link</button>
    <button class="toolbar-btn" onclick="insertFormat('table')">⊞ Table</button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn" onclick="insertFormat('hr')">— HR</button>
    <button class="toolbar-btn" onclick="document.getElementById('inputText').value='';document.getElementById('outputText').innerHTML='<span class=placeholder>Output here...</span>'">🗑 Clear</button>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="pane">
      <div class="pane-header">Input <span style="font-weight:400;text-transform:none" id="charCount">0 chars</span></div>
      <textarea id="inputText" placeholder="Paste or type your text here...&#10;&#10;Tips:&#10;- First line becomes H1&#10;- Lines ending with : become H2&#10;- ALL CAPS lines become H3&#10;- Use 1. for numbered lists&#10;- Use - for bullet points&#10;- Use [ ] for task lists"></textarea>
    </div>
    <div class="pane">
      <div class="pane-header">Output <span class="stats" id="statsLabel"></span></div>
      <div id="outputText"><span class="placeholder">Your Markdown will appear here...</span></div>
    </div>
  </div>

  <!-- History Sidebar -->
  <div class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <h3>📜 History</h3>
      <button class="btn btn-danger btn-sm" onclick="clearHistory()">Clear all</button>
    </div>
    <div class="history-list" id="historyList">
      <p class="placeholder" style="text-align:center;padding:32px">No history yet</p>
    </div>
  </div>
</div>

<!-- Notification -->
<div class="notification hidden" id="notification"></div>

<!-- Shortcuts -->
<div class="shortcuts">
  <kbd>Ctrl+Enter</kbd> Convert<br>
  <kbd>Ctrl+Shift+C</kbd> Copy<br>
  <kbd>Ctrl+H</kbd> History<br>
  <kbd>Ctrl+K</kbd> Clear
</div>

<script>
// ============================================================
// CONVERTER ENGINE (Pure JS)
// ============================================================
class MarkdownConverter {
  convert(text, format = 'claude') {
    if (!text.trim()) return { markdown: '', stats: null }

    const lines = text.split('\n')
    const result = []
    const elements = { headers: 0, lists: 0, code: 0, tasks: 0, quotes: 0 }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i]
      const stripped = line.trim()
      const prevEmpty = i > 0 && !lines[i-1].trim()

      if (!stripped) { result.push(''); continue }

      // H1: first non-empty line, reasonable length
      if (i === 0 && stripped.length < 100 && !stripped.startsWith('#')) {
        result.push(`# ${stripped}`)
        elements.headers++
        continue
      }

      // H2: line ending with colon
      if (stripped.endsWith(':') && stripped.length < 80 && !stripped.startsWith('#') && !stripped.startsWith('-')) {
        result.push(`## ${stripped}`)
        elements.headers++
        continue
      }

      // H3: ALL CAPS short line
      if (stripped === stripped.toUpperCase() && stripped.length < 60 && !stripped.startsWith('#') && !/^\d+$/.test(stripped) && /[A-Z]/.test(stripped)) {
        result.push(`### ${stripped}`)
        elements.headers++
        continue
      }

      // Numbered list
      const numMatch = stripped.match(/^(\d+)[.)]\s*(.+)/)
      if (numMatch) {
        result.push(`${numMatch[1]}. ${numMatch[2].trim()}`)
        elements.lists++
        continue
      }

      // Task list
      const taskMatch = stripped.match(/^\[([ xX])\]\s*(.+)/)
      if (taskMatch) {
        const checked = taskMatch[1].toLowerCase() === 'x' ? 'x' : ' '
        result.push(`- [${checked}] ${taskMatch[2].trim()}`)
        elements.tasks++
        continue
      }

      // Bullet list
      if (/^[\-*+]\s/.test(stripped)) {
        result.push(`- ${stripped.slice(1).trim()}`)
        elements.lists++
        continue
      }

      // Blockquote
      if (stripped.startsWith('>')) {
        result.push(stripped)
        elements.quotes++
        continue
      }

      // Horizontal rule
      if (/^[\-*_]{3,}$/.test(stripped)) {
        result.push('---')
        continue
      }

      // Code fence
      if (stripped.startsWith('```')) {
        result.push(stripped)
        elements.code++
        continue
      }

      // Default
      result.push(line)
    }

    let markdown = result.join('\n')
    markdown = markdown.replace(/\n{3,}/g, '\n\n').trim()

    const originalTokens = Math.floor(text.split(/\s+/).length * 1.3)
    const markdownTokens = Math.floor(markdown.split(/\s+/).length * 1.3)
    const tokensSaved = Math.max(0, originalTokens - markdownTokens)
    const compression = text.length ? ((1 - markdown.length / text.length) * 100).toFixed(1) : 0

    return {
      markdown,
      stats: {
        originalChars: text.length,
        markdownChars: markdown.length,
        tokensSaved,
        compression,
        elements
      }
    }
  }
}

// ============================================================
// APP
// ============================================================
const converter = new MarkdownConverter()
const inputEl = document.getElementById('inputText')
const outputEl = document.getElementById('outputText')
const statsEl = document.getElementById('statsLabel')
const charCount = document.getElementById('charCount')
const notification = document.getElementById('notification')
const historyList = document.getElementById('historyList')
const sidebar = document.getElementById('sidebar')
const formatSelect = document.getElementById('formatSelect')

let history = JSON.parse(localStorage.getItem('mdconvert_history') || '[]')
let convertTimer = null

// Auto-convert with debounce
inputEl.addEventListener('input', () => {
  charCount.textContent = `${inputEl.value.length} chars`
  clearTimeout(convertTimer)
  convertTimer = setTimeout(convertText, 400)
})

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault()
    convertText()
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
    e.preventDefault()
    copyOutput()
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'h' || e.key === 'H')) {
    e.preventDefault()
    toggleHistory()
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault()
    inputEl.value = ''
    outputEl.innerHTML = '<span class="placeholder">Output here...</span>'
    charCount.textContent = '0 chars'
    statsEl.textContent = ''
  }
})

// Sync scroll
inputEl.addEventListener('scroll', () => {
  outputEl.scrollTop = inputEl.scrollTop
})

outputEl.addEventListener('scroll', () => {
  inputEl.scrollTop = outputEl.scrollTop
})

// Drag and drop
document.addEventListener('dragover', (e) => e.preventDefault())
document.addEventListener('drop', (e) => {
  e.preventDefault()
  const file = e.dataTransfer.files[0]
  if (file) {
    const reader = new FileReader()
    reader.onload = (ev) => {
      inputEl.value = ev.target.result
      charCount.textContent = `${inputEl.value.length} chars`
      convertText()
    }
    reader.readAsText(file)
  }
})

// Paste from clipboard
document.addEventListener('paste', async () => {
  try {
    const text = await navigator.clipboard.readText()
    if (text && !inputEl.value) {
      inputEl.value = text
      charCount.textContent = `${text.length} chars`
      convertText()
    }
  } catch (e) {}
})

// Convert
function convertText() {
  const text = inputEl.value
  if (!text.trim()) {
    outputEl.innerHTML = '<span class="placeholder">Your Markdown will appear here...</span>'
    statsEl.textContent = ''
    return
  }

  const result = converter.convert(text, formatSelect.value)
  outputEl.textContent = result.markdown

  if (result.stats) {
    statsEl.textContent = `~${result.stats.tokensSaved} tokens saved · ${result.stats.compression}% smaller`
  }

  // Save to history
  saveToHistory(text, result.markdown)
}

// Copy
async function copyOutput() {
  const text = outputEl.textContent
  if (!text || text.includes('will appear here')) return

  try {
    await navigator.clipboard.writeText(text)
    showNotification('✅ Copied to clipboard!')
  } catch (e) {
    // Fallback
    const ta = document.createElement('textarea')
    ta.value = text
    document.body.appendChild(ta)
    ta.select()
    document.execCommand('copy')
    document.body.removeChild(ta)
    showNotification('✅ Copied!')
  }
}

// Insert formatting
function insertFormat(type) {
  const el = inputEl
  const start = el.selectionStart
  const end = el.selectionEnd
  const text = el.value
  const selected = text.substring(start, end) || ''

  let replacement = ''
  switch (type) {
    case 'h1': replacement = `# ${selected || 'Heading 1'}`; break
    case 'h2': replacement = `## ${selected || 'Heading 2'}`; break
    case 'h3': replacement = `### ${selected || 'Heading 3'}`; break
    case 'bold': replacement = `**${selected || 'bold text'}**`; break
    case 'italic': replacement = `*${selected || 'italic text'}*`; break
    case 'strike': replacement = `~~${selected || 'strikethrough'}~~`; break
    case 'code': replacement = `\`${selected || 'code'}\``; break
    case 'ul': replacement = `- ${selected || 'list item'}`; break
    case 'ol': replacement = `1. ${selected || 'list item'}`; break
    case 'task': replacement = `- [ ] ${selected || 'task'}`; break
    case 'quote': replacement = `> ${selected || 'quote'}`; break
    case 'link': replacement = `[${selected || 'link text'}](url)`; break
    case 'table': replacement = `| ${selected || 'Header'} | Header |\n| --- | --- |\n| Cell | Cell |`; break
    case 'hr': replacement = '\n---\n'; break
  }

  el.value = text.substring(0, start) + replacement + text.substring(end)
  el.focus()
  el.setSelectionRange(start + replacement.length, start + replacement.length)
  charCount.textContent = `${el.value.length} chars`
  convertText()
}

// History
function saveToHistory(input, output) {
  const entry = {
    id: Date.now(),
    title: input.split('\n')[0].slice(0, 80) || 'Untitled',
    input: input.slice(0, 500),
    output: output,
    timestamp: new Date().toISOString(),
    inputLen: input.length,
    outputLen: output.length
  }

  history.unshift(entry)
  history = history.slice(0, 50)
  localStorage.setItem('mdconvert_history', JSON.stringify(history))
  renderHistory()
}

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<p class="placeholder" style="text-align:center;padding:32px">No history yet</p>'
    return
  }

  historyList.innerHTML = history.map(item => `
    <div class="history-item" onclick="loadFromHistory(${item.id})">
      <div class="history-title">${escapeHtml(item.title)}</div>
      <div class="history-meta">${formatDate(item.timestamp)} · ${item.inputLen} → ${item.outputLen} chars</div>
    </div>
  `).join('')
}

function loadFromHistory(id) {
  const item = history.find(h => h.id === id)
  if (item) {
    inputEl.value = item.input
    outputEl.textContent = item.output
    charCount.textContent = `${item.input.length} chars`
  }
}

function clearHistory() {
  history = []
  localStorage.removeItem('mdconvert_history')
  renderHistory()
  showNotification('History cleared')
}

function toggleHistory() {
  sidebar.classList.toggle('hidden')
}

// Helpers
function showNotification(msg, isError = false) {
  notification.textContent = msg
  notification.className = `notification${isError ? ' error' : ''}`
  setTimeout(() => notification.classList.add('hidden'), 2000)
}

function escapeHtml(str) {
  const div = document.createElement('div')
  div.textContent = str
  return div.innerHTML
}

function formatDate(ts) {
  const d = new Date(ts)
  const now = new Date()
  const diff = now - d
  if (diff < 6e4) return 'Just now'
  if (diff < 36e5) return `${Math.floor(diff/6e4)}m ago`
  if (diff < 864e5) return `${Math.floor(diff/36e5)}h ago`
  return d.toLocaleDateString()
}

// Init
renderHistory()
</script>
</body>
</html>
